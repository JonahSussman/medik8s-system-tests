name: Check Test Case

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - 'release-*'
      - 'medik8s-*'
    paths:
      - 'docs/TESTCASES/**'
      - 'scripts/check-testcase.sh'
      - 'scripts/check-testcase-jira.sh'
      - '.github/workflows/check-testcase.yml'

  pull_request:
    paths:
      - 'docs/TESTCASES/**'
      - 'scripts/check-testcase.sh'
      - 'scripts/check-testcase-jira.sh'
      - '.github/workflows/check-testcase.yml'

permissions:
  contents: read

jobs:
  check:
    name: Check test case documents
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Checks the skeleton and every docs/TESTCASES/rhwa-<id>.md for the parts
      # a machine can check: the thirteen sections, the metadata rows, and
      # leftover placeholders. The rest of docs/TESTCASES/AGENTS.md is a human
      # review checklist, not a gate.
      - name: Check test case documents
        run: make check-testcase

      # The ticket behind each document must be a Task, titled "TEST: ...", and
      # labelled rhwa-test. Red Hat Jira serves these three fields anonymously,
      # so this needs no credentials and works on pull requests from forks. An
      # unreachable Jira warns rather than failing the run.
      - name: Check Jira tickets
        run: make check-testcase-jira
        env:
          JIRA_BASE_URL: https://redhat.atlassian.net
